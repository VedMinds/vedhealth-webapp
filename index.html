<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VedHealth - Transforming Healthcare Delivery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        .hero-section {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #4a4a4a, #7d7d7d);
            overflow: hidden;
        }

        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><defs><linearGradient id="healthcare" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:%2300d4ff"/><stop offset="50%" style="stop-color:%2000ffcc"/><stop offset="100%" style="stop-color:%2366ffef"/></linearGradient><radialGradient id="pulse" cx="50%" cy="50%"><stop offset="0%" style="stop-color:%23ffffff" opacity="0.9"/><stop offset="100%" style="stop-color:%2300d4ff" opacity="0.5"/></radialGradient></defs><rect width="1200" height="800" fill="%23ffffff"/><circle cx="300" cy="200" r="80" fill="url(%23pulse)" opacity="0.8"><animate attributeName="r" values="60;100;60" dur="3s" repeatCount="indefinite"/></circle><circle cx="900" cy="300" r="60" fill="url(%23pulse)" opacity="0.6"><animate attributeName="r" values="40;80;40" dur="4s" repeatCount="indefinite"/></circle><path d="M200,400 Q400,300 600,400 T1000,400" stroke="url(%23healthcare)" stroke-width="8" fill="none" opacity="0.9"/><rect x="100" y="500" width="80" height="120" rx="10" fill="url(%23healthcare)" opacity="0.8"/><rect x="200" y="480" width="80" height="140" rx="10" fill="url(%23healthcare)" opacity="0.9"/><rect x="300" y="460" width="80" height="160" rx="10" fill="url(%23healthcare)" opacity="1"/><circle cx="600" cy="600" r="30" fill="%23ffffff"><animate attributeName="cy" values="580;620;580" dur="2s" repeatCount="indefinite"/></circle><path d="M590,600 L610,600 M600,590 L600,610" stroke="%2300d4ff" stroke-width="4" stroke-linecap="round"/></svg>') center/cover;
            animation: subtle-movement 8s ease-in-out infinite;
            opacity: 0.6;
        }

        @keyframes subtle-movement {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.05) rotate(1deg); }
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
            max-width: 800px;
            padding: 0 20px;
            animation: fade-in-up 1.5s ease-out;
        }

        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #00d4ff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            letter-spacing: -2px;
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 212, 255, 0.4); }
            to { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 212, 255, 0.6); }
        }

        .tagline {
            font-size: 2.6rem;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 25px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 50px;
            font-weight: 300;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .app-buttons {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 60px;
        }

        .app-btn {
            display: inline-flex;
            align-items: center;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.4s ease;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .app-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .app-btn:hover::before {
            left: 100%;
        }

        .app-btn:hover {
            transform: translateY(-5px);
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .app-icon {
            width: 40px;
            height: 40px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .logo {
                font-size: 2.5rem;
            }
            
            .tagline {
                font-size: 1.8rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .app-buttons {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
            
            .app-btn {
                width: 280px;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .hero-content {
                padding: 0 15px;
            }
            
            .logo {
                font-size: 2.5rem;
            }
            
            .tagline {
                font-size: 1.8rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
        }

        /* Additional animations */
        .floating-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-element {
            position: absolute;
            background: rgba(51, 221, 255, 0.2);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .floating-element:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }

        .floating-element:nth-child(3) {
            width: 60px;
            height: 60px;
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
                opacity: 0.4;
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
                opacity: 0.7;
            }
        }
    </style>
</head>
<body>
    <div class="hero-section">
        <div class="video-background"></div>
        <div class="overlay"></div>
        
        <div class="floating-elements">
            <div class="floating-element"></div>
            <div class="floating-element"></div>
            <div class="floating-element"></div>
        </div>
        
        <div class="hero-content">
            <h1 class="logo">VedHealth</h1>
            <h2 class="tagline">
                Transforming healthcare delivery<br>
                through innovative digital solutions
            </h2>
            <p class="subtitle">
                Experience comprehensive healthcare services<br>
                with our advanced digital platform
            </p>
            
            <div class="app-buttons">
                <a href="#" class="app-btn" id="playStoreBtn">
                    <div class="app-icon">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234285F4' d='M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.61 3,21.09 3,20.5Z'/%3E%3Cpath fill='%23EA4335' d='M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12Z'/%3E%3Cpath fill='%23FBBC04' d='M16.81,8.88L14.54,11.15L6.05,2.66L16.81,8.88Z'/%3E%3Cpath fill='%2334A853' d='M16.81,15.12L20.16,13.26C20.5,13.05 20.75,12.68 20.75,12.24C20.75,11.8 20.5,11.43 20.16,11.22L16.81,9.36L14.54,12L16.81,15.12Z'/%3E%3C/svg%3E" alt="Google Play">
                    </div>
                    <div>
                        <div style="font-size: 0.8rem; opacity: 0.8;">GET IT ON</div>
                        <div style="font-size: 1.1rem; font-weight: 600;">Google Play</div>
                    </div>
                </a>
                
                <a href="#" class="app-btn" id="appStoreBtn">
                    <div class="app-icon">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23000000' d='M18.71,19.5C17.88,20.74 17,21.95 15.66,21.97C14.32,22 13.89,21.18 12.37,21.18C10.84,21.18 10.37,21.95 9.1,22C7.79,22.05 6.8,20.68 6,19.47C4.35,17 3.15,12.8 4.85,9.94C5.69,8.5 7.14,7.59 8.73,7.57C10.03,7.55 11.25,8.48 12.05,8.48C12.85,8.48 14.34,7.39 15.92,7.55C16.56,7.58 18.18,7.81 19.16,9.35C19.08,9.4 17.81,10.2 17.82,11.87C17.84,13.8 19.4,14.5 19.42,14.5C19.4,14.56 19.17,15.4 18.71,19.5Z M15.84,5.5C16.5,4.67 16.97,3.54 16.84,2.4C15.87,2.44 14.7,3.03 14,3.89C13.35,4.67 12.8,5.83 12.96,6.94C14.05,7 15.19,6.36 15.84,5.5Z'/%3E%3C/svg%3E" alt="App Store">
                    </div>
                    <div>
                        <div style="font-size: 0.8rem; opacity: 0.8;">Download on the</div>
                        <div style="font-size: 1.1rem; font-weight: 600;">App Store</div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <script>
        // App button click handlers
        document.getElementById('playStoreBtn').addEventListener('click', function(e) {
            e.preventDefault();
            // Add ripple effect
            createRipple(e, this);
            setTimeout(() => {
                alert('Redirecting to Google Play Store...');
            }, 300);
        });

        document.getElementById('appStoreBtn').addEventListener('click', function(e) {
            e.preventDefault();
            // Add ripple effect
            createRipple(e, this);
            setTimeout(() => {
                alert('Redirecting to App Store...');
            }, 300);
        });

        // Ripple effect function
        function createRipple(event, element) {
            const ripple = document.createElement('span');
            const rect = element.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = event.clientX - rect.left - size / 2;
            const y = event.clientY - rect.top - size / 2;
            
            ripple.style.cssText = `
                position: absolute;
                width: ${size}px;
                height: ${size}px;
                left: ${x}px;
                top: ${y}px;
                background: rgba(255, 255, 255, 0.3);
                border-radius: 50%;
                transform: scale(0);
                animation: ripple 0.6s ease-out;
                pointer-events: none;
            `;
            
            element.style.position = 'relative';
            element.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 600);
        }

        // Add ripple animation CSS
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    transform: scale(2);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Parallax scroll effect for floating elements
        window.addEventListener('scroll', function() {
            const scrolled = window.pageYOffset;
            const parallaxElements = document.querySelectorAll('.floating-element');
            
            parallaxElements.forEach((element, index) => {
                const speed = 0.5 + (index * 0.2);
                element.style.transform = `translateY(${scrolled * speed}px)`;
            });
        });

        // Add loading animation
        window.addEventListener('load', function() {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s ease-in-out';
            
            setTimeout(() => {
                document.body.style.opacity = '1';
            }, 100);
        });

        // Dynamic text animation
        function animateText() {
            const tagline = document.querySelector('.tagline');
            const text = tagline.textContent;
            tagline.innerHTML = '';
            
            [...text].forEach((char, index) => {
                const span = document.createElement('span');
                span.textContent = char;
                span.style.animationDelay = `${index * 0.1}s`;
                span.style.animation = 'fadeInChar 0.5s ease-out forwards';
                span.style.opacity = '0';
                tagline.appendChild(span);
            });
        }
        
        const charStyle = document.createElement('style');
        charStyle.textContent = `
            @keyframes fadeInChar {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        `;
        document.head.appendChild(charStyle);
        setTimeout(animateText, 1000);
    </script>
</body>
</html>
